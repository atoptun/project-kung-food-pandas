<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ears -->
  <circle cx="16" cy="17" r="9" fill="#050505" />
  <circle cx="16" cy="17" r="5" fill="#1A1A1A" />
  <circle cx="48" cy="17" r="9" fill="#050505" />
  <circle cx="48" cy="17" r="5" fill="#1A1A1A" />

  <!-- Head Base -->
  <circle cx="32" cy="35" r="23" fill="#FFFFFF" stroke="#050505" stroke-width="2.5" />

  <!-- Eye Patches (rotated dark ovals) -->
  <ellipse cx="23" cy="33" rx="6.5" ry="8" transform="rotate(-18 23 33)" fill="#050505" />
  <ellipse cx="41" cy="33" rx="6.5" ry="8" transform="rotate(18 41 33)" fill="#050505" />

  <!-- Eyes (sparkles/pupils) -->
  <circle cx="23.5" cy="32.5" r="2.2" fill="#FFFFFF" />
  <circle cx="22" cy="34" r="1" fill="#FFFFFF" />
  <circle cx="40.5" cy="32.5" r="2.2" fill="#FFFFFF" />
  <circle cx="42" cy="34" r="1" fill="#FFFFFF" />

  <!-- Nose -->
  <ellipse cx="32" cy="41" rx="3.8" ry="2.6" fill="#050505" />
  <ellipse cx="32" cy="40.3" rx="1.5" ry="0.8" fill="#555555" />

  <!-- Mouth -->
  <path d="M29 44.5 C29.5 46.5, 31.5 47, 32 47 C32.5 47, 34.5 46.5, 35 44.5" stroke="#050505" stroke-width="2" stroke-linecap="round" fill="none" />
  <line x1="32" y1="42.5" x2="32" y2="45.5" stroke="#050505" stroke-width="2" stroke-linecap="round" />

  <!-- Cute Cheeks -->
  <circle cx="15.5" cy="41" r="3" fill="#FFAAA6" opacity="0.65" />
  <circle cx="48.5" cy="41" r="3" fill="#FFAAA6" opacity="0.65" />

  <!-- Little Chef Toque / Foodie Accent -->
  <path d="M27 15 C27 11, 30 9, 32 9 C34 9, 37 11, 37 15 Z" fill="#FFFFFF" stroke="#050505" stroke-width="2" />
  <ellipse cx="32" cy="15" rx="5.5" ry="2" fill="#FFFFFF" stroke="#050505" stroke-width="1.8" />
  <line x1="30" y1="12" x2="30" y2="15" stroke="#050505" stroke-width="1" stroke-linecap="round" />
  <line x1="32" y1="11" x2="32" y2="15" stroke="#050505" stroke-width="1" stroke-linecap="round" />
  <line x1="34" y1="12" x2="34" y2="15" stroke="#050505" stroke-width="1" stroke-linecap="round" />
</svg>
