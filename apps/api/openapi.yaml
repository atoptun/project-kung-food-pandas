openapi: 3.0.3
info:
  title: Kung Food Pandas API
  version: 0.1.0
  description: REST API documentation for Kung Food Pandas.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:4000
    description: Local Development Server
  - url: https://kung-food-pandas-api.onrender.com
    description: Production Server (Render)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: panda@panda.com
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Panda
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: StrongPass123!
      required:
        - email
        - name
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: panda@panda.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: StrongPass123!
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        email:
          type: string
          format: email
          example: panda@panda.com
        name:
          type: string
          example: Panda
      required:
        - email
        - name
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - token
        - user
    LivenessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        timestamp:
          type: string
          format: date-time
          example: 2026-11-09T12:00:00.000Z
        uptime:
          type: number
          minimum: 0
          example: 42.15
      required:
        - status
        - timestamp
        - uptime
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - degraded
          example: ready
        timestamp:
          type: string
          format: date-time
          example: 2026-11-09T12:00:00.000Z
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
              example: up
          required:
            - database
      required:
        - status
        - timestamp
        - checks
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
          example: error
        message:
          type: string
          example: Validation failed
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                example: body.email
              message:
                type: string
                example: Invalid email address
            required:
              - path
              - message
      required:
        - status
        - message
    FollowActionResponse:
      type: object
      properties:
        message:
          type: string
          example: Successfully followed user
      required:
        - message
    FollowListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/FollowUser"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - users
        - pagination
    FollowUser:
      type: object
      properties:
        id:
          type: string
          example: cm123user456
        name:
          type: string
          example: Panda
        avatar:
          type: string
          nullable: true
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/FollowRecipe"
      required:
        - id
        - name
        - avatar
        - recipes
    FollowRecipe:
      type: object
      properties:
        id:
          type: string
          example: recipe-123
        title:
          type: string
          example: Kung Pao Chicken
        thumb:
          type: string
          nullable: true
        preview:
          type: string
          nullable: true
        time:
          type: integer
          nullable: true
      required:
        - id
        - title
        - thumb
        - preview
        - time
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        limit:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        totalCount:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - limit
        - totalCount
        - totalPages
  parameters: {}
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account and returns a session token with basic
        user profile.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: User with this email already exists
          content:
            application/json:
              example:
                status: error
                message: User with this email already exists
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              example:
                status: error
                message: Validation failed
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates a user by email and password and returns a session token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              example:
                status: error
                message: Invalid credentials
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              example:
                status: error
                message: Validation failed
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Invalidates the current user session token.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out successfully
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /healthz:
    get:
      tags:
        - System
      summary: Liveness probe
      description: Verifies that the process is alive.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      tags:
        - System
      summary: Readiness probe
      description: Verifies that the service is ready to accept traffic.
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service is not ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /users/me/following:
    get:
      operationId: listFollowing
      tags:
        - Users
      summary: List users followed by the current user
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Following list
          headers: &a1
            X-Total-Count:
              description: Total number of matching users, before pagination.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowListResponse"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              example:
                status: error
                message: Invalid pagination parameters
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /users/{id}/followers:
    get:
      operationId: listFollowers
      tags:
        - Users
      summary: List followers of a user
      description: This endpoint requires authentication; follower lists are private.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            example: cm123user456
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Followers list
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowListResponse"
        "400":
          description: Invalid parameters or pagination
          content:
            application/json:
              example:
                status: error
                message: Invalid parameters or pagination
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              example:
                status: error
                message: User not found
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /users/me/following/{id}:
    post:
      operationId: followUser
      tags:
        - Users
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            example: cm123user456
          required: true
          name: id
          in: path
      responses:
        "201":
          description: Follow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowActionResponse"
        "400":
          description: Cannot follow yourself
          content:
            application/json:
              example:
                status: error
                message: Cannot follow yourself
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              example:
                status: error
                message: User not found
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Already following this user
          content:
            application/json:
              example:
                status: error
                message: Already following this user
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    delete:
      operationId: unfollowUser
      tags:
        - Users
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            example: cm123user456
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Follow removed
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: User or follow relationship not found
          content:
            application/json:
              example:
                status: error
                message: User or follow relationship not found
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
