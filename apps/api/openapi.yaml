  /sign-in/social:
    post:
      tags:
        - BetterAuth
      description: Sign in with a social provider
      operationId: socialSignIn
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackURL:
                  type: string
                  description: Callback URL to redirect to after the user has signed in
                newUserCallbackURL:
                  type: string
                errorCallbackURL:
                  type: string
                  description: Callback URL to redirect to if an error happens
                provider:
                  anyOf:
                    - type: string
                      enum:
                        - apple
                        - atlassian
                        - cloudflare
                        - cognito
                        - discord
                        - facebook
                        - figma
                        - github
                        - microsoft
                        - google
                        - huggingface
                        - slack
                        - spotify
                        - twitch
                        - twitter
                        - dropbox
                        - kick
                        - linear
                        - linkedin
                        - gitlab
                        - tiktok
                        - reddit
                        - roblox
                        - salesforce
                        - vk
                        - zoom
                        - notion
                        - kakao
                        - naver
                        - line
                        - paybin
                        - paypal
                        - polar
                        - railway
                        - vercel
                        - wechat
                    - type: string
                disableRedirect:
                  type: boolean
                  description: Disable automatic redirection to the provider. Useful for handling
                    the redirection yourself
                idToken:
                  type: object
                  properties:
                    token:
                      type: string
                      description: ID token from the provider
                    nonce:
                      type: string
                      description: Nonce used to generate the token
                    accessToken:
                      type: string
                      description: Access token from the provider
                    refreshToken:
                      type: string
                      description: Refresh token from the provider
                    expiresAt:
                      type: number
                      description: Expiry date of the token
                    user:
                      type: object
                      properties:
                        name:
                          type: object
                          properties:
                            firstName:
                              type: string
                            lastName:
                              type: string
                        email:
                          type: string
                      description: The user object from the provider. Only available for some
                        providers like Apple.
                  required:
                    - token
                scopes:
                  type: array
                  items:
                    type: string
                  description: Array of scopes to request from the provider. This will override
                    the default scopes passed.
                requestSignUp:
                  type: boolean
                  description: Explicitly request sign-up. Useful when disableImplicitSignUp is
                    true for this provider
                loginHint:
                  type: string
                  description: The login hint to use for the authorization code request
                additionalParams:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
                  description: Extra query parameters to append to the provider authorization URL
                    (e.g. Cognito identity_provider, Google hd).
                additionalData:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
                - provider
      responses:
        "200":
          description: Success - Returns session details (idToken branch) or an authorize
            URL (redirect branch)
          content:
            application/json:
              schema:
                type: object
                description: Returns session details when idToken is provided, or an authorize
                  URL otherwise
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    $ref: "#/components/schemas/User"
                  url:
                    type: string
                  redirect:
                    type: boolean
                required:
                  - redirect
        "400":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          description: Bad Request. Usually due to missing parameters, or invalid
            parameters.
        "401":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          description: Unauthorized. Due to missing or invalid authentication.
        "403":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Forbidden. You do not have permission to access this resource or to
            perform this action.
        "404":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Not Found. The requested resource was not found.
        "429":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Too Many Requests. You have exceeded the rate limit. Try again later.
        "500":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Internal Server Error. This is a problem with the server that you
            cannot fix.
