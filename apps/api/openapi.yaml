openapi: 3.0.3
info:
  title: Kung Food Pandas API
  version: 0.1.0
  description: REST API documentation for Kung Food Pandas.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: Current Server
  - url: https://project-kung-food-pandas.onrender.com
    description: Production (Render)
  - url: http://localhost:4000
    description: Local Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: panda@panda.com
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Panda
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: StrongPass123!
      required:
        - email
        - name
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: panda@panda.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: StrongPass123!
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        email:
          type: string
          format: email
          example: panda@panda.com
        name:
          type: string
          example: Panda
        avatar:
          type: string
          nullable: true
          example: https://res.cloudinary.com/.../avatar.jpg
      required:
        - id
        - email
        - name
    PublicUser:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        name:
          type: string
          example: Panda
        avatar:
          type: string
          nullable: true
          example: https://res.cloudinary.com/.../avatar.jpg
      required:
        - id
        - name
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - token
        - user
    AreaResponse:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 6462a6f04c3d0ddd28897f9b
        name:
          type: string
          maxLength: 255
          example: Ukrainian
      required:
        - id
        - name
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 6462a6cd4c3d0ddd28897f8f
        name:
          type: string
          maxLength: 100
          example: Dessert
      required:
        - id
        - name
    IngredientResponse:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 640c2dd963a319ea671e382c
        name:
          type: string
          maxLength: 255
          example: Pears
        description:
          type: string
          nullable: true
          example: A sweet and juicy fruit with a soft, grainy texture and thin skin.
        img:
          type: string
          nullable: true
          format: uri
          example: https://res.cloudinary.com/.../pears.jpg
      required:
        - id
        - name
    TestimonialResponse:
      type: object
      properties:
        id:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d2
        testimonial:
          type: string
          example: This is a testimonial message.
        owner:
          $ref: "#/components/schemas/PublicUser"
      required:
        - id
        - testimonial
        - owner
    TestimonialsListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Testimonial"
          required:
            - items
    Testimonial:
      type: object
      properties:
        id:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d2
        testimonial:
          type: string
          example: This is a testimonial message.
        owner:
          $ref: "#/components/schemas/PublicUser"
      required:
        - id
        - testimonial
        - owner
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          example: 100
        page:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 1
        totalPages:
          type: integer
          minimum: 0
          example: 10
        limit:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 10
      required:
        - total
        - page
        - totalPages
        - limit
    LivenessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        timestamp:
          type: string
          format: date-time
          example: 2026-11-09T12:00:00.000Z
        uptime:
          type: number
          minimum: 0
          example: 42.15
      required:
        - status
        - timestamp
        - uptime
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - degraded
          example: ready
        timestamp:
          type: string
          format: date-time
          example: 2026-11-09T12:00:00.000Z
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
              example: up
          required:
            - database
      required:
        - status
        - timestamp
        - checks
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
          example: error
        message:
          type: string
          example: Validation failed
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                example: body.email
              message:
                type: string
                example: Invalid email address
            required:
              - path
              - message
      required:
        - status
        - message
    RecipeIdParam:
      type: object
      properties:
        id:
          type: string
          maxLength: 36
          example: 64c8d958249fae54bae90bb9
      required:
        - id
    RecipeFilterQuery:
      allOf:
        - $ref: "#/components/schemas/PaginationQuery"
        - type: object
          properties:
            category:
              type: string
              description: Category ID
              example: 6462a6cd4c3d0ddd28897f8f
            area:
              type: string
              description: Area ID
              example: 6462a6f04c3d0ddd28897f9b
            ingredient:
              type: string
              description: Ingredient ID
              example: 640c2dd963a319ea671e382c
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          example: 10
    PopularRecipesQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 4
          example: 4
    CreateRecipeRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
          example: Spaghetti Bolognese
        description:
          type: string
          example: Classic Italian rich pasta dish
        instructions:
          type: string
          minLength: 10
          example: 1. Boil water. 2. Cook pasta...
        categoryId:
          type: string
          maxLength: 32
          example: 6462a6cd4c3d0ddd28897f8f
        areaId:
          type: string
          maxLength: 32
          example: 6462a6f04c3d0ddd28897f9b
        time:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 45
        ingredients:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/RecipeIngredientInput"
            - type: string
      required:
        - title
        - instructions
        - categoryId
        - areaId
        - ingredients
    RecipeIngredientInput:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 64c8d958249fae54bae90bb1
        measure:
          type: string
          minLength: 1
          maxLength: 100
          example: 200g
      required:
        - id
        - measure
    CreateRecipeMultipartRequest:
      allOf:
        - $ref: "#/components/schemas/CreateRecipeRequest"
        - type: object
          properties:
            thumb:
              type: string
              format: binary
              description: Recipe image file (jpg, png, webp; max 5MB)
    RecipeCard:
      allOf:
        - $ref: "#/components/schemas/RecipeShortCard"
        - type: object
          properties:
            time:
              type: number
              nullable: true
              example: 45
            favoritesCount:
              type: integer
              minimum: 0
              example: 12
            owner:
              allOf:
                - $ref: "#/components/schemas/PublicUser"
                - description: Recipe owner information
    RecipeShortCard:
      allOf:
        - $ref: "#/components/schemas/RecipeTinyCard"
        - type: object
          properties:
            description:
              type: string
              nullable: true
              example: Classic Italian rich pasta dish
    RecipeTinyCard:
      type: object
      properties:
        id:
          type: string
          example: 64c8d958249fae54bae90bb9
        title:
          type: string
          example: Recipe 1
        thumb:
          type: string
          nullable: true
          example: https://res.cloudinary.com/.../thumb.jpg
      required:
        - id
        - title
    RecipeDetails:
      allOf:
        - $ref: "#/components/schemas/RecipeCard"
        - type: object
          properties:
            instructions:
              type: string
              nullable: true
              example: 1. Cook pasta. 2. Make sauce...
            category:
              type: object
              properties:
                id:
                  type: string
                  example: cat-1
                name:
                  type: string
                  example: Beef
              required:
                - id
                - name
            area:
              type: object
              properties:
                id:
                  type: string
                  example: area-1
                name:
                  type: string
                  example: Italian
              required:
                - id
                - name
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/RecipeIngredientDetail"
              description: Full ingredients list with descriptions
          required:
            - ingredients
    RecipeIngredientDetail:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 640c2dd963a319ea671e382c
        name:
          type: string
          maxLength: 255
          example: Pears
        description:
          type: string
          nullable: true
          example: A sweet and juicy fruit with a soft, grainy texture and thin skin.
        img:
          type: string
          nullable: true
          format: uri
          example: https://res.cloudinary.com/.../pears.jpg
        measure:
          type: string
          nullable: true
          example: 500g
      required:
        - id
        - name
    RecipesListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RecipeCard"
          required:
            - items
    RecipeActionResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation successful
      required:
        - message
    CurrentUserProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        recipesCount:
          type: integer
          minimum: 0
          example: 12
        favoritesCount:
          type: integer
          minimum: 0
          example: 5
        followersCount:
          type: integer
          minimum: 0
          example: 48
        followingCount:
          type: integer
          minimum: 0
          example: 15
      required:
        - user
        - recipesCount
        - favoritesCount
        - followersCount
        - followingCount
    UserPublicProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        recipesCount:
          type: integer
          minimum: 0
          example: 12
        followersCount:
          type: integer
          minimum: 0
          example: 48
      required:
        - user
        - recipesCount
        - followersCount
    UserFollowersListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserFollowerItem"
          required:
            - items
    UserFollowerItem:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        recipesCount:
          type: integer
          minimum: 0
          example: 2
        topRecipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeTinyCard"
          description: Up to 4 latest/top recipes
      required:
        - user
        - recipesCount
        - topRecipes
    UserRecipesListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RecipeShortCard"
          required:
            - items
    FollowActionResponse:
      type: object
      properties:
        message:
          type: string
          example: Successfully followed the user.
      required:
        - message
    AvatarUploadRequest:
      type: object
      properties:
        avatar:
          type: string
          format: binary
          description: Avatar image file (jpg, png, webp; max 5MB)
    Area:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 6462a6f04c3d0ddd28897f9b
        name:
          type: string
          maxLength: 255
          example: Ukrainian
      required:
        - id
        - name
    Category:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
          example: 6462a6cd4c3d0ddd28897f8f
        name:
          type: string
          maxLength: 100
          example: Dessert
      required:
        - id
        - name
    CreateRecipeMultipart:
      allOf:
        - $ref: "#/components/schemas/CreateRecipeRequest"
        - type: object
          properties:
            thumb:
              type: string
              format: binary
              description: Recipe image file (jpg, png, webp; max 5MB)
    AvatarUpload:
      type: object
      properties:
        avatar:
          type: string
          format: binary
          description: Avatar image file (jpg, png, webp; max 5MB)
  parameters: {}
paths:
  /auth/register:
    post:
      tags: &a1
        - Auth
      summary: Register a new user
      description: Creates a new user account and returns a session token with basic
        user profile.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: User with this email already exists
          content:
            application/json:
              example:
                status: error
                message: User with this email already exists
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              example:
                status: error
                message: Validation failed
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /auth/login:
    post:
      tags: *a1
      summary: Login user
      description: Authenticates a user by email and password and returns a session token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              example:
                status: error
                message: Invalid credentials
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              example:
                status: error
                message: Validation failed
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /auth/logout:
    post:
      tags: *a1
      summary: Logout user
      description: Invalidates the current user session token.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out successfully
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /areas:
    get:
      tags: &a2
        - Dictionaries
      summary: Get list of all areas
      responses:
        "200":
          description: List of areas retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
  /categories:
    get:
      tags: *a2
      summary: Get list of all categories
      responses:
        "200":
          description: List of categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /ingredients:
    get:
      tags: *a2
      summary: Get list of all ingredients
      responses:
        "200":
          description: List of ingredients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 32
                      example: 640c2dd963a319ea671e382c
                    name:
                      type: string
                      maxLength: 255
                      example: Pears
                    description:
                      type: string
                      nullable: true
                      example: A sweet and juicy fruit with a soft, grainy texture and thin skin.
                    img:
                      type: string
                      nullable: true
                      format: uri
                      example: https://res.cloudinary.com/.../pears.jpg
                  required:
                    - id
                    - name
  /testimonials:
    get:
      tags: *a2
      summary: Get list of testimonials with pagination
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: List of testimonials retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestimonialsListResponse"
  /healthz:
    get:
      tags:
        - System
      summary: Liveness probe
      description: Verifies that the process is alive.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      tags:
        - System
      summary: Readiness probe
      description: Verifies that the service is ready to accept traffic.
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service is not ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /recipes:
    get:
      tags: &a3
        - Recipes
      summary: Search recipes with filters and pagination
      description: Filter recipes by category, area, or ingredient with pagination support.
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
          required: false
          name: limit
          in: query
        - schema:
            type: string
            description: Category ID
            example: 6462a6cd4c3d0ddd28897f8f
          required: false
          description: Category ID
          name: category
          in: query
        - schema:
            type: string
            description: Area ID
            example: 6462a6f04c3d0ddd28897f9b
          required: false
          description: Area ID
          name: area
          in: query
        - schema:
            type: string
            description: Ingredient ID
            example: 640c2dd963a319ea671e382c
          required: false
          description: Ingredient ID
          name: ingredient
          in: query
      responses:
        "200":
          description: List of filtered recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipesListResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              example:
                status: error
                message: Invalid query parameters
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      tags: *a3
      summary: Create a new recipe
      description: Creates a custom recipe for the authenticated user. Supports both
        JSON body and multipart/form-data upload.
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateRecipeMultipart"
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeRequest"
      responses:
        "201":
          description: Recipe created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetails"
        "400":
          description: Invalid input data or image format
          content:
            application/json:
              example:
                status: error
                message: Invalid input data or image format
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              example:
                status: error
                message: Validation failed
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /recipes/popular:
    get:
      tags: *a3
      summary: Get popular recipes
      description: Returns top recipes sorted by number of users who added them to
        favorites.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 4
            example: 4
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: List of popular recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeCard"
  /recipes/own:
    get:
      tags: *a3
      summary: Get current user recipes
      description: Returns recipes created by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: List of user own recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipesListResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /recipes/favorites:
    get:
      tags: *a3
      summary: Get current user favorite recipes
      description: Returns all recipes added to favorites by the authenticated user
        with pagination.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: List of favorite recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipesListResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              example:
                status: error
                message: Not authorized
              schema:
