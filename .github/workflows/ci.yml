name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pr-policy:
    name: Enforce Branch & Scope Isolation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          REGEX="^(feat|fix|chore|docs|refactor|test|ci|perf)\/(api|web|shared|docs|repo)\/[a-z0-9-]+$"
          if [[ ! "$HEAD_REF" =~ $REGEX ]]; then
            echo "::error::Invalid branch name '$HEAD_REF'. Expected <type>/<scope>/<short-kebab-description>."
            exit 1
          fi

      - name: Prevent mixing apps/api and apps/web in a single PR
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [[ "$HEAD_REF" == *"/repo/"* ]] || echo "$PR_LABELS" | grep -q "allow-cross-scope"; then
            echo "Repo-scoped branch or allow-cross-scope label detected. Skipping scope isolation check."
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          TOUCHES_API=$(echo "$CHANGED_FILES" | grep -c "^apps/api/" || true)
          TOUCHES_WEB=$(echo "$CHANGED_FILES" | grep -c "^apps/web/" || true)

          if [[ "$TOUCHES_API" -gt 0 && "$TOUCHES_WEB" -gt 0 ]]; then
            echo "::error::This PR modifies both apps/api/ and apps/web/. Please split backend and frontend changes into separate Pull Requests."
            exit 1
          fi

  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kfp
          POSTGRES_PASSWORD: kfp_local_pass
          POSTGRES_DB: kfp_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kfp -d kfp_db_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://kfp:kfp_local_pass@localhost:5432/kfp_db_test?schema=public
      DIRECT_URL: postgresql://kfp:kfp_local_pass@localhost:5432/kfp_db_test?schema=public
      TEST_DATABASE_URL: postgresql://kfp:kfp_local_pass@localhost:5432/kfp_db_test?schema=public
      CLOUDINARY_URL: cloudinary://test_key:test_secret@test_cloud
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Prepare Test Database Schema
        run: |
          if [ -d "apps/api/prisma/migrations" ]; then
            pnpm --filter @repo/api db:migrate:deploy
          else
            pnpm --filter @repo/api exec prisma db push
          fi

      - name: Lint & Format Check
        run: |
          pnpm lint
          pnpm format:check

      - name: Validate OpenAPI Specification
        run: pnpm docs:lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build All Packages
        run: pnpm build
