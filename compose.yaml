services:
  postgres:
    image: postgres:18-alpine
    container_name: kfp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfp_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kfp_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kfp} -d ${POSTGRES_DB:-kfp_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
